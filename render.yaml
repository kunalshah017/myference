services:
  - type: web
    name: myference-api
    runtime: go
    plan: free
    region: singapore
    repo: https://github.com/kunalshah017/myference
    branch: main
    autoDeployTrigger: checksPass
    buildCommand: mkdir -p bin && go build -o bin/myference-server ./server/cmd/myference-server && go build -o bin/myference-migrate ./server/cmd/myference-migrate
    startCommand: ./bin/myference-migrate && ./bin/myference-server
    healthCheckPath: /healthz
    envVars:
      - key: MYFERENCE_DATABASE_URL
        fromDatabase:
          name: myference-postgres
          property: connectionString
      - key: MYFERENCE_RPC_URL
        sync: false
      - key: MYFERENCE_CONTRACT_ADDRESS
        sync: false
      - key: MYFERENCE_SETTLEMENT_PRIVATE_KEY
        sync: false
      - key: MYFERENCE_CHAIN_START_BLOCK
        sync: false
      - key: MYFERENCE_WEB_ORIGIN
        sync: false
      - key: MYFERENCE_AUTH_DOMAIN
        sync: false
      - key: MYFERENCE_EXPLORER_URL
        sync: false

  - type: web
    name: myference-web
    runtime: static
    repo: https://github.com/kunalshah017/myference
    branch: main
    autoDeployTrigger: checksPass
    rootDir: web
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    envVars:
      - key: VITE_MYFERENCE_API_URL
        sync: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

databases:
  - name: myference-postgres
    plan: free
    region: singapore
    databaseName: myference
    user: myference
    ipAllowList: []
