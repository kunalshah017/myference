name: verify

on:
  pull_request:
  push:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - run: go test ./...
      - run: go test -race ./cli/internal/provider ./cli/internal/platform/windows
      - run: go vet ./...
      - run: go build ./...
      - run: ./scripts/build-release.sh

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm test -- --run
      - run: npm run lint
      - run: sh ../scripts/test-installers.sh
      - run: npm run build

  windows-installer:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Verify Windows CLI and proxy
        shell: pwsh
        run: |
          go test ./... -count=1
          go vet ./...
          go build -o "$env:RUNNER_TEMP/myference.exe" ./cli/cmd/myference
          go build -o "$env:RUNNER_TEMP/myference-agent-proxy.exe" ./cli/cmd/myference-agent-proxy
      - name: Parse PowerShell installer
        shell: pwsh
        run: |
          foreach ($file in @('web/public/install.ps1', 'packaging/windows/install.ps1', 'scripts/windows-acceptance.ps1')) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $file), [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors.Count -gt 0) { $errors | Format-List; exit 1 }
          }
      - name: Install latest Windows CLI
        shell: pwsh
        run: |
          & ./scripts/test-installer-windows.ps1
      - name: Non-destructive Windows acceptance
        shell: pwsh
        run: ./scripts/windows-acceptance.ps1 -NonDestructive

  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: foundry-rs/foundry-toolchain@v1
      - run: forge fmt --root contracts --check
      - run: forge test --root contracts
